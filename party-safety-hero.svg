<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Safe teenage party scene</title>
  <desc id="desc">A stylised party room with colourful lights, friends talking, and one friend checking on another.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#18243a"/>
      <stop offset="1" stop-color="#111019"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07101c"/>
      <stop offset="0.46" stop-color="#121927"/>
      <stop offset="1" stop-color="#180d16"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0.28" cy="0.24" r="0.62">
      <stop offset="0" stop-color="#42e8ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#42e8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coralGlow" cx="0.82" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#ff6d7a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff6d7a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

